name: Deploy site

# Every push to main rebuilds the whole site from content/ (pages, publications, CV page,
# and the LaTeX CV in cv/) and publishes it to GitHub Pages. The run also keeps cv/main.tex,
# cv/main.bib and cv/main.pdf as a downloadable "cv" artifact.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install image and CV tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick latexmk texlive-latex-extra texlive-bibtex-extra texlive-fonts-extra
          pip install -r requirements.txt
      - name: Build site and CV PDF
        env:
          JEKYLL_ENV: production
          CV_PDF_REQUIRED: "1" # fail the deploy instead of publishing a site without a CV PDF
        run: bundle exec jekyll build
      - name: Keep the LaTeX CV
        uses: actions/upload-artifact@v7
        with:
          name: cv
          path: |
            cv/main.tex
            cv/main.bib
            cv/main.pdf
      - name: Purge unused CSS
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
