name: Deploy site

# Every push to main rebuilds the whole site from content/ (pages, publications, CV page,
# and the LaTeX CV in cv/) and publishes it by pushing the built site to the gh-pages branch,
# which GitHub Pages serves (Settings -> Pages -> Deploy from a branch: gh-pages, / (root)).
# The run also keeps cv/main.tex, cv/main.bib and cv/main.pdf as a downloadable "cv" artifact.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write # push the built site to gh-pages

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # The TeX Live, ImageMagick and Ruby setup below is tested on Ubuntu 24.04; move to a newer
    # image deliberately, not through ubuntu-latest.
    runs-on: ubuntu-24.04
    timeout-minutes: 30 # a normal deploy takes about 3 minutes
    env:
      APT_PACKAGES: imagemagick latexmk texlive-latex-extra texlive-bibtex-extra texlive-fonts-extra
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3" # latest 3.3.x; newer runner images only ship the latest patch release
          bundler-cache: true
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      # The LaTeX and ImageMagick packages (~1 GB) are cached so a deploy doesn't depend on a fresh
      # download from Ubuntu's servers. The key includes the runner image version, so the cached
      # packages always match the system they are installed on; a new image downloads them once.
      - name: Name the package cache
        id: debs-key
        run: echo "key=debs-$ImageOS-$ImageVersion-$(echo "$APT_PACKAGES" | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - name: Restore cached packages
        id: debs
        uses: actions/cache/restore@v6
        with:
          path: ~/debs
          key: ${{ steps.debs-key.outputs.key }}
      - name: Install image and CV tools
        timeout-minutes: 10 # normally under 3 minutes; fail instead of hanging on a stalled download
        run: |
          apt="sudo apt-get -y --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          if [ "${{ steps.debs.outputs.cache-hit }}" != "true" ]; then
            mkdir -p ~/debs/partial
            sudo apt-get update -o Acquire::Retries=3
            $apt install --download-only -o Dir::Cache::archives="$HOME/debs" $APT_PACKAGES
            sudo rm -rf ~/debs/partial ~/debs/lock
            sudo chown -R "$(id -u):$(id -g)" ~/debs
          fi
          # dpkg installs straight from the files, never from the network (apt would try the mirror first).
          sudo dpkg -i ~/debs/*.deb
          pip install -r requirements.txt
      - name: Save downloaded packages
        if: steps.debs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/debs
          key: ${{ steps.debs-key.outputs.key }}
      - name: Build site and CV PDF
        env:
          JEKYLL_ENV: production
          CV_PDF_REQUIRED: "1" # fail the deploy instead of publishing a site without a CV PDF
        # With a CNAME file (the custom domain) the site lives at the root; without one, GitHub
        # serves it from mavivi0.github.io/<repository name>/.
        run: |
          if [ -f CNAME ]; then baseurl=""; else baseurl="/${GITHUB_REPOSITORY#*/}"; fi
          bundle exec jekyll build --baseurl "$baseurl"
      - name: Keep the LaTeX CV
        uses: actions/upload-artifact@v7
        with:
          name: cv
          path: |
            cv/main.tex
            cv/main.bib
            cv/main.pdf
      - name: Purge unused CSS
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js
      - name: Serve the built site as is
        run: touch _site/.nojekyll # stops GitHub Pages from running Jekyll over the built files
      - name: Publish to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
