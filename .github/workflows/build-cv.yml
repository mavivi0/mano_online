name: Build CV PDF

# Disabled 2026-08-27: all triggers commented out at user request (see repo history/PR for context).
# To re-enable: uncomment the block below and delete this placeholder line, then `gh workflow enable <name>`.
on: {}
# on:
#   push:
#     branches:
#       - main
#       - master
#     paths:
#       - "assets/json/resume.json"
#       - "_bibliography/papers.bib"
#       - "latex-cv/template.tex.j2"
#       - "bin/generate_cv.py"
#   workflow_dispatch:
#
permissions:
  contents: write

jobs:
  build-cv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Jinja2
        run: pip install jinja2
      - name: Generate main.tex from resume.json + papers.bib
        run: python3 bin/generate_cv.py
      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: latex-cv
      - name: Copy PDF into assets
        run: cp latex-cv/main.pdf assets/pdf/cv.pdf
      - name: Commit the rebuilt CV PDF
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git add assets/pdf/cv.pdf
          git diff --staged --quiet || git commit -m "chore: rebuild CV PDF from resume.json / papers.bib"
          git push
